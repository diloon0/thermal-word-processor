# Settings for the Obelix bridge.
# On the Pi this file lives at /boot/firmware/obelix-bridge.conf, which is on the SD card's
# small first partition. You can edit it on the Pi (sudo nano), or put the card in a laptop.
# Restart the bridge after a change:  sudo systemctl restart obelix-bridge

[bridge]
# The Bluetooth name computers see. The word processor looks for a paired device called
# "Obelix", so change both together.
name = Obelix

# Who may pair:
#   window = new computers can pair for a few minutes after the Pi powers on (the default)
#   open   = new computers can pair at any time
#   closed = nobody new can pair; only computers that already paired can print
# Suggested: leave "window" while setting up, then switch to "closed".
pairing = window
pairing_minutes = 5

# Optional extra lock: only these computers' Bluetooth addresses may print.
# Leave empty to allow every paired computer. Example: AA:BB:CC:DD:EE:FF, 11:22:33:44:55:66
allowed =

# Which printer:
#   auto                       = the first USB printer found (/dev/usb/lp0)
#   /dev/usb/lp1               = a particular one
#   pyusb                      = fallback if printing works but status checks don't
#                                (needs: sudo apt install python3-usb)
#   pretend:/tmp/capture.bin   = no printer: save the bytes to a file and answer "all fine".
#                                For testing the Bluetooth link without using paper.
printer = auto
usb_vendor = 04b8

# Bluetooth serial channel. The word processor connects to channel 1.
channel = 1

# Set to 9100 to also accept print jobs over the network (Wi-Fi), for testing at home.
# 0 = off. Leave it off once things work: anyone on the network could print.
tcp_port = 0

# Hang up on a computer that connects and then sends nothing for this many seconds.
idle_seconds = 120

# Show the state on the Pi's green light:
#   heartbeat (two quick flashes, pause) = ready
#   steady blinking                      = ready, and pairing is open
#   solid                                = a job is going through
led = yes
